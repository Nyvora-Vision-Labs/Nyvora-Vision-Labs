svg{display:block;width:100%;height:100%;background:#0B1430}
.upscan{animation:upscan 6s linear infinite}
@keyframes upscan{0%{transform:translateY(0);opacity:1}20%{transform:translateY(190px);opacity:1}21%,100%{transform:translateY(190px);opacity:0}}
.det{opacity:0;animation:det 6s linear infinite}
