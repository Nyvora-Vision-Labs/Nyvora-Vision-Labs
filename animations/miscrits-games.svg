.cursor{animation:blink 1s steps(2) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
.f1,.f2,.f3{transform-box:fill-box;transform-origin:0 50%}
.f1{animation:f1 6s ease-in-out infinite}.f2{animation:f2 6s ease-in-out infinite}.f3{animation:f3 6s ease-in-out infinite}
