svg{display:block;width:100%;height:100%;background:#0B1430}
.tile{transform-box:fill-box;transform-origin:50% 50%;animation:flip 6s ease-in-out infinite}
@keyframes flip{0%{transform:scaleY(1)}3%{transform:scaleY(0)}6%,100%{transform:scaleY(1)}}
.tile rect{animation:tfill 6s linear infinite}
