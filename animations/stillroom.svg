<script><![CDATA[
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bound = [];
  document.querySelectorAll('*').forEach(function (el) {
    var b = [];
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (a.name.indexOf('data-bind-') === 0) b.push([a.name.slice(10), a.value]);
    }
    if (b.length) bound.push([el, b]);
  });
  function vals(t) {
    var v = {};
    var vols = [0.8, 0.6, 0.45, 0.3, 0.55, 0.35];
    vols.forEach(function (vo, i) {
      var lv = vo * (0.72 + 0.28 * Math.sin(t * 0.006 + i * 1.7)) * (0.86 + 0.14 * Math.sin(t * 0.017 + i));
      var hh = +(84 * lv).toFixed(1);
      v['sr.h' + i] = hh; v['sr.y' + i] = +(200 - hh).toFixed(1);
    });
    var w1 = '', w2 = '';
    for (var s = 0; s <= 86; s++) {
      var x = 28 + s * 4, env = Math.sin(Math.PI * (x - 28) / 344);
      var y1 = 55 + 16 * env * (0.6 * Math.sin(x * 0.08 + t * 0.004) + 0.3 * Math.sin(x * 0.21 - t * 0.007) + 0.1 * Math.sin(x * 0.5 + t * 0.013));
      var yb = 55 + 9 * env * (0.7 * Math.sin(x * 0.05 - t * 0.003) + 0.3 * Math.sin(x * 0.17 + t * 0.009));
      w1 += (s ? 'L' : 'M') + x + ' ' + y1.toFixed(1);
      w2 += (s ? 'L' : 'M') + x + ' ' + yb.toFixed(1);
    }
    v['sr.wave'] = w1; v['sr.wave2'] = w2;
    return v;
  }
  function apply(t) {
    var v = vals(t);
    bound.forEach(function (pair) {
      pair[1].forEach(function (b) {
        if (b[0] === 'text') pair[0].textContent = v[b[1]];
        else pair[0].setAttribute(b[0], v[b[1]]);
      });
    });
  }
  var start = performance.now(), last = 0;
  function frame(now) {
    if (now - last > 33) { last = now; apply(Math.max(0, now - start)); }
    requestAnimationFrame(frame);
  }
  if (reduce) apply(3500); else requestAnimationFrame(frame);
})();
]]></script>
