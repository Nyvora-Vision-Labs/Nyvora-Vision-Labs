<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation: a Nepali tweet sentence is labeled by three annotators; they agree on positive, then a second sentence gets two negative votes and one neutral" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid meet">
