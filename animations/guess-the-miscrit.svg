.i1{opacity:0;animation:i1 6s linear infinite}.i2{opacity:0;animation:i2 6s linear infinite}.i3{opacity:0;animation:i3 6s linear infinite}
@keyframes i1{0%,18%{opacity:0}20%,94%{opacity:1}100%{opacity:0}}
@keyframes i2{0%,36%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
@keyframes i3{0%,58%{opacity:0}60%,94%{opacity:1}100%{opacity:0}}
.spark{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:spark 6s ease-out infinite}
@keyframes spark{0%,62%{transform:scale(0) rotate(0)}70%{transform:scale(1.2) rotate(45deg)}80%{transform:scale(0.8) rotate(90deg)}90%{transform:scale(1) rotate(120deg)}100%{transform:scale(0) rotate(160deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.spark{transform:none}.rank{transform:none}.det,.i1,.i2,.i3,.rfade{opacity:1}}
@media (prefers-reduced-motion: reduce){.ns2,.lxB,.na2,.nv4,.nv5,.nv6{opacity:0 !important}.nv1,.nv2,.nv3,.na1{opacity:1}.lxbar{transform:none}}
]]></style>
